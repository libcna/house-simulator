<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>House Simulator</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #101318; color: #f3f4f6; }
    body { display: grid; place-items: center; font: 16px system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; max-width: 100vw; max-height: 100vh; border: 0; background: #101318; }
    #loading {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: #101318; pointer-events: none;
    }
    #loading[hidden] { display: none; }
    #loading-content { width: min(26rem, calc(100vw - 3rem)); text-align: center; }
    #loading h1 { margin: 0 0 1.5rem; font-size: 1.5rem; font-weight: 500; }
    #status { min-height: 1.5rem; margin: 0 0 0.75rem; }
    progress { display: block; width: 100%; height: 0.75rem; accent-color: #8ab4e8; }
  </style>
</head>
<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <div id="loading" role="status" aria-live="polite">
    <div id="loading-content">
      <h1>House Simulator</h1>
      <p id="status">Downloading house assets…</p>
      <progress id="progress" max="1" value="0"></progress>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('canvas');
    const loading = document.getElementById('loading');
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');

    canvas.addEventListener('webglcontextlost', function (event) {
      event.preventDefault();
      loading.hidden = false;
      status.textContent = 'Graphics context lost. Reload the page to continue.';
      progress.hidden = true;
    });

    function setStatus(message) {
      if (!message) {
        // The in-game LoadingScreen now owns the gesture prompt and the transition to menu.
        loading.hidden = true;
        return;
      }
      loading.hidden = false;
      const counts = message.match(/\((\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)\)/);
      if (counts) {
        progress.max = Number(counts[2]);
        progress.value = Number(counts[1]);
        progress.hidden = false;
        status.textContent = message.slice(0, counts.index).trim();
      } else {
        status.textContent = message;
        if (message === 'All downloads complete.') {
          progress.max = 1;
          progress.value = 1;
          progress.hidden = false;
        }
      }
    }

    var Module = {
      canvas: canvas,
      // HOUSE-02898: `?arg=--scene=walk&arg=--player=...` passes the desktop command line, so a
      // measurement or CI smoke run starts where it needs to without clicking through the menus.
      arguments: new URLSearchParams(window.location.search).getAll('arg'),
      setStatus: setStatus,
      totalDependencies: 0,
      monitorRunDependencies: function (left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        setStatus(left ? 'Preparing house assets (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')'
                       : 'All downloads complete.');
      }
    };
    window.addEventListener('error', function (event) {
      if (event.target !== window) return;
      loading.hidden = false;
      status.textContent = 'Unable to start. Check the browser console and reload.';
      progress.hidden = true;
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
