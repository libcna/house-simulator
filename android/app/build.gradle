plugins {
    id 'com.android.application'
}

def houseRoot = rootProject.projectDir.parentFile
def cnaRoot = new File(houseRoot.parentFile, 'cna')
def sharpRuntimeRoot = new File(houseRoot.parentFile, 'sharp-runtime')
def hostContentTool = new File(houseRoot, 'build/CNA_BUILD/cna-content')
// HOUSE-03033: the APK carries the host content build's shipped tree at the Android preset's LOD
// level. `-PhouseContent=<dir>` names another host content tree than build/content.
def hostContent = new File(project.findProperty('houseContent') ?: new File(houseRoot, 'build/content').path)
def androidStage = new File(houseRoot, 'build-probe/android-stage')

android {
    namespace 'com.libcna.house'
    compileSdk 35
    buildToolsVersion '36.1.0'
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'com.libcna.house'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'

        externalNativeBuild {
            cmake {
                // arm64-v8a is what ships; `-PhouseAbi=x86_64` builds for an x86_64 emulator, which
                // then runs natively instead of through its arm64 translator.
                abiFilters project.findProperty('houseAbi') ?: 'arm64-v8a'
                targets 'main'
                arguments '-DANDROID_PLATFORM=android-24',
                    "-DCNAHOUSE_CNA_ROOT=${cnaRoot.canonicalPath}",
                    "-DCNAHOUSE_SHARP_RUNTIME_ROOT=${sharpRuntimeRoot.canonicalPath}",
                    "-DCNAHOUSE_CONTENT_EXECUTABLE=${hostContentTool.canonicalPath}",
                    '-DCMAKE_C_COMPILER_LAUNCHER=ccache',
                    '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache'
            }
        }
    }

    buildTypes {
        release {
            // Installable as built: signed with the local debug key, not a store key.
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        main {
            // CNA already vendors SDLActivity and its Java bridge. Keep one copy.
            java.srcDir new File(cnaRoot, 'third_party/SDL/android-project/app/src/main/java')
            assets.srcDir androidStage
        }
    }

    externalNativeBuild {
        cmake {
            path file('jni/CMakeLists.txt')
            version '4.1.2'
            buildStagingDirectory new File(houseRoot, 'build-probe/android-cxx')
        }
    }
}

// Stages what the APK ships before its assets are merged: tools/ci/stage_content.py with the
// Android preset's LOD level (2); no content-fx, because the Android build has no Tier E.
tasks.register('stageHouseContent', Exec) {
    commandLine 'python3', new File(houseRoot, 'tools/ci/stage_content.py').path,
        '--content', hostContent.path, '--out', androidStage.path, '--lod-level', '2'
}
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach {
    dependsOn 'stageHouseContent'
}

// The APK just assembled against cna-house.md §71.5's 400 MB and the staged tree it must carry --
// only that variant's: the other variant's APK may predate the current stage.
['Debug', 'Release'].each { variant ->
    def check = tasks.register("checkApkBudget${variant}", Exec) {
        commandLine 'python3', new File(houseRoot, 'tools/ci/android_budget.py').path,
            '--apk-dir', new File(project.buildDir, "outputs/apk/${variant.toLowerCase()}").path,
            '--stage', androidStage.path
    }
    tasks.matching { it.name == "assemble${variant}" }.configureEach { finalizedBy check }
}
