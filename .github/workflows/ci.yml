# cna-house CI.
#
# The jobs mirror `plan.md` HOUSE-00133..HOUSE-00138 one for one, and the split is by COST rather
# than by convenience: lint runs in seconds and gates every push, the sanitizer and render jobs are
# nightly because they are slow and because a red nightly is a message rather than a blocked merge.
#
# `cna-house` builds against `../cnanext` and `../sharp-runtimenext` as SIBLING checkouts
# (`cna-house.md` §8.1), so every build job checks all three out into that shape. There is no
# vendoring and no submodule to init; a runner that skipped a sibling would fail at configure with
# the message the root `CMakeLists.txt` prints, which is the intended behaviour.
name: ci

on:
  push:
  pull_request:
  schedule:
    # Nightly, after most working days have ended in Europe.
    - cron: "0 2 * * *"

env:
  # One ccache, always, and `CCACHE_BASEDIR` is what unifies hashes across build trees. The
  # openeggbert build rules exist because the alternative measured 330 s per build instead of 15 s.
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 2G

jobs:
  # --- HOUSE-00133 -------------------------------------------------------------------------------
  lint:
    name: lint (xna-only, layout, clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: cna-house }
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Run the gates
        working-directory: cna-house
        run: tools/ci/run_checks.sh
      - name: The committed effect baseline must match its source
        working-directory: cna-house
        # Runs on a runner with no Wine and no DirectX SDK, which is the whole point: a stale
        # `.xnb` is invisible on every machine that cannot compile effects, and this compares
        # hashes rather than compiling (`HOUSE-00185`).
        run: tools/effects/build_effects.sh --check

      - name: Asset provenance
        working-directory: cna-house
        # Separate from `run_checks.sh` so the CI log shows WHICH provenance rule failed. The
        # packaging run is the shipping gate (ADR-0012) and is allowed to fail here: it names the
        # assets that are development-only, which is information rather than a broken build.
        run: |
          python3 tools/ci/check_manifest.py
          python3 tools/assets/verify_licences.py --check
          python3 tools/assets/verify_licences.py --packaging \
            || echo "note: the packaging gate refuses the assets listed above; see licenses/THIRD-PARTY-ASSETS.md"

      - name: The pack partition and its budget report
        working-directory: cna-house
        # `HOUSE-00202`/`HOUSE-00203`. `--selftest` proves the report reports what it claims -- most
        # importantly that an unmeasurable value comes back UNKNOWN rather than 0, because a report
        # that silently zeroes an unbuilt asset says every budget is comfortably met.
        run: |
          python3 tools/assets/manifest.py packs
          python3 tools/ci/budget_report.py --selftest

      - name: The audio-derivative tools must measure what they claim
        working-directory: cna-house
        # `HOUSE-00220`/`HOUSE-00221`. Both make claims a listener cannot check in a build log --
        # "a 4th-order low-pass at 900 Hz", "the tail is 0.15 s", "it does not clip" -- so both
        # selftests MEASURE them: tone-by-tone response for the filter, and the impulse response
        # itself for the reverb tails. `audio_probe.py` decodes the WAV rather than asking ffmpeg,
        # so the measurement is of the bytes and not of the intention.
        run: |
          sudo apt-get install -y ffmpeg
          python3 tools/assets/dull_variants.py --selftest
          python3 tools/assets/reverb_variants.py --selftest

      - name: The NOX selection rules must select what they claim
        working-directory: cna-house
        # `HOUSE-00277`. The pool itself lives in scratch space and is not in CI, so what runs here
        # is the RULES against a fixture the selftest builds: one file for each exclusion, a
        # clipped file, a silent file, a group over its cap, and one no rule claims. The claim that
        # matters most is the partition -- every file selected, excluded, rejected or listed, none
        # of them twice -- because a selection that lost a file in the middle looks exactly like a
        # selection that did not want it.
        run: python3 tools/assets/nox_select.py --selftest

      - name: The video transcode must put every frame in the right cell
        working-directory: cna-house
        # `HOUSE-00219`. The fixture's every frame carries a black bar whose LENGTH is its own
        # index, so a decoded atlas cell says exactly which source frame it holds -- which is the
        # only way to catch a transposed grid, an off-by-one, or a frame dropped at the boundary
        # between the first atlas and the second. Six seconds at 12 fps is 72 frames, so the
        # second atlas exists and its first cell can be shown to hold frame 64.
        run: |
          python3 -m pip install --break-system-packages --user numpy pillow
          python3 tools/assets/video_transcode.py --selftest

      - name: The glTF gate must reject what it claims to
        working-directory: cna-house
        # `--selftest` plants three broken files -- a truncated header, wrong magic, and a
        # structurally valid file that breaks the one-skin project rule -- and requires each to be
        # rejected with a message that names the reason.
        run: python3 tools/assets/gltf_validate.py --selftest

      - name: The scale and origin gates must reject what they claim to
        working-directory: cna-house
        run: |
          python3 tools/assets/scale_check.py --selftest
          python3 tools/assets/origin_check.py --selftest
          python3 tools/assets/pbr_to_stock.py --selftest

      - name: The eleven world rules must catch what they claim, and only that
        working-directory: cna-house
        # `HOUSE-00358`. The fixture is a two-storey house small enough to hold in the head and
        # real enough to be worth passing: 9 cells, 8 portals (one of them horizontal, because a
        # `stair_well` is not a hole in a wall), a WC stacked over a WC on a drain, and a 0.5 m
        # closet whose shelf is reached from the corridor because nobody can stand in the closet.
        #
        # The claim that matters is not "the mutation is caught" but "**only** its own rule
        # catches it": a rule that reports its neighbour's problem looks like a working rule right
        # up to the day the neighbour is switched off. There is one mutation per rule and each is
        # required to fire exactly one.
        run: |
          python3 -m pip install --break-system-packages --user jsonschema
          python3 tools/world/validate_world.py --selftest

      - name: The authored JSONC must become JSON the runtime can actually parse
        working-directory: cna-house
        # `HOUSE-00421`. `world-format.md` specifies both halves of the format and only one was
        # built: `System::Text::Json` refuses the first comment, so `WorldLoader` could not read a
        # file anybody had authored. The claim that matters is that the deployed copy is STRICT
        # JSON with the same parsed content -- not the source with the comment characters blanked.
        run: python3 tools/world/deploy_world.py --selftest

      - name: The manifest and the worldHash must be one definition, not two
        working-directory: cna-house
        # `HOUSE-00364`. The hash is written by Python and verified by C++, so the two halves have
        # to agree byte for byte or every save written by one is stale to the other. The Python
        # selftest pins the definition; `WorldLoaderTests` pins the C++ against a literal this tool
        # produced for the same two members.
        run: python3 tools/world/world_manifest.py --selftest

      - name: The world files must have a schema a machine can check
        working-directory: cna-house
        # `HOUSE-00341`. The sixteen schemas are generated from one source, so what this proves is
        # that they still reject what they claim to: a lower-case id, a cell with no footprint, an
        # unknown field, a header borrowed from another kind. It also proves the two things they
        # deliberately do NOT do -- a portal naming cells that do not exist, and a box with
        # min > max, both pass -- because those need the whole layout at once and belong to
        # `validate_world.py` (`HOUSE-00358`), not to a second weaker copy of it here.
        #
        # `--check` runs in the lint gate above and needs no jsonschema; only the selftest and
        # `--validate` do, which is why the install is here and not there.
        run: |
          python3 -m pip install --break-system-packages --user jsonschema
          python3 tools/world/world_schema.py --selftest

      - name: The graph report must measure the graph, not restate the design
        working-directory: cna-house
        # `HOUSE-00359`. §16.3's numbers were designed before the layout existed, so this computes
        # them instead, and `HOUSE-00396` added the cross-check the other way: §16 naming a portal
        # nobody authored, and a §16.3 metric row that has drifted or been deleted, both fail.
        # The claims that matter are the two graphs and the difference between them:
        # through open doors the fixture is one connected house; with every door shut it falls
        # into four pieces, which is §16.3's "whole point" at fixture scale. A disconnected graph
        # reports its diameter as ∞ and not as the largest finite distance it happened to find.
        run: |
          python3 -m pip install --break-system-packages --user jsonschema
          python3 tools/world/report_graph.py --selftest

      - name: The window schedule must be measured, and §12.6 must agree with it
        working-directory: cna-house
        # `HOUSE-00380`. §12.6's counts table is maintained by hand and `HOUSE-00376` found it
        # fifteen windows out. The claims that matter: a door in the same wall is not a window; the
        # size reported is the PORTAL's, which is the hole, not the leaf's; a drifted count is
        # named with both numbers; a window on no known façade is reported rather than quietly
        # dropped; and a cna-house.md with no table at all fails instead of passing.
        run: |
          python3 tools/world/window_schedule.py --selftest

      - name: The floor plans must be drawn from the layout, with north up
        working-directory: cna-house
        # `HOUSE-00398`. The claim that matters is the one nobody would notice being wrong: §14
        # puts north at -Z, so a cell further north is drawn HIGHER on the page. A plan with north
        # upside down is a plan every reviewer acts on and nobody questions.
        run: |
          python3 tools/world/floor_plans.py --selftest

      - name: Rooms must become walls, and the collision file must read back
        working-directory: cna-house
        # `HOUSE-00210`. The fixture is three rooms chosen so that every rule has something to
        # prove: an L-shaped cell (whose own internal edge must NOT become a wall), a shared wall
        # carrying both a door and a window, and one side that is garage partition for part of its
        # length and exterior for the rest. `read_back` parses the bytes the writer just produced,
        # so the format cannot drift from a C++ reader that does not exist yet (`HOUSE-00541`).
        run: |
          python3 tools/world/layout_io.py --selftest
          python3 tools/world/build_collision.py --selftest

      - name: The pet graph must not offer a route the animal does not fit
        working-directory: cna-house
        # `HOUSE-00211`. The fixture adds furniture on the lounge centroid and a window beside the
        # door, because both are rules that an empty room cannot test: "chosen to avoid furniture"
        # is vacuous with nothing to avoid, and a window is the portal that must NOT become a
        # doorway node. Edge tests are the animal's capsule axis against the collision world, so
        # this step also re-exercises `build_collision` end to end.
        run: python3 tools/world/build_nav.py --selftest

      - name: Rain must stop at the porch edge and nowhere else
        working-directory: cna-house
        # `HOUSE-00212`. The fixture gains a porch with a bedroom directly above it and a cellar
        # under the lounge, because both are rules an ordinary room cannot test: the porch soffit
        # is the bedroom's floor, and the cellar's slabs are below ground and must NOT shelter the
        # lawn. The strongest claim is an equivalence over every cell of the grid -- sheltered
        # exactly where the cell's CENTRE is under a slab -- which is what refutes a conservative
        # field that would stop the rain 0.25 m out in the open.
        run: python3 tools/world/build_coverage.py --selftest

      - name: Static props must batch into chunks the runtime can draw
        working-directory: cna-house
        # `HOUSE-00215`. The fixture's box is deliberately CHIRAL -- 0.5 m across x, 2.0 m along z,
        # every normal along +x -- because a cube with up-facing normals is invariant under the yaw
        # this tool bakes in, and two injected bugs walked straight through the cube version. It
        # also carries a 30 400-vertex model so the 16-bit split is exercised by props that each
        # fit and together do not, rather than by one that never fitted.
        run: python3 tools/world/build_chunks.py --selftest

      - name: Sky exposure must measure geometry, not sampling noise
        working-directory: cna-house
        # `HOUSE-00213`. The Monte Carlo estimator is checked against three geometries whose answer
        # is known exactly -- open sky (1), an unbounded lid (0), a half-plane (0.5) -- and the
        # direction set against `1 - cos 45 = 0.293`, which is what separates a uniform solid-angle
        # distribution from a latitude/longitude grid that would weight a skylight like a wall of
        # glass. The grid broad phase is asserted to agree with brute force on every ray: one that
        # also changed answers would not be an optimisation.
        run: python3 tools/world/build_skyexposure.py --selftest

      - name: The boundary and the street must still be buildable
        working-directory: cna-house
        # `HOUSE-00785`. `fence_gen.py` refuses a `structures` row whose asset it has no builder
        # for, which is right and which is exactly what it did from the day `HOUSE-00775` added
        # §10.4's stone wall -- with nothing running it, so `build/fence` kept the files it had
        # written before and the chunk build kept reading them. `neighbourhood_gen.py`
        # (`HOUSE-00841`) is here from its first day for the same reason.
        run: |
          python3 tools/world/fence_gen.py --selftest
          python3 tools/world/neighbourhood_gen.py --selftest
          python3 tools/world/build_neighbourhood.py --selftest

      - name: The exterior tree must be part of the content build
        working-directory: cna-house
        # `HOUSE-00227`. Gating the generators' selftests is a different question from whether
        # anything RUNS them: it did not, and `build/terrain` came to hold tiles three hours older
        # than the height field they are drawn from while `chunks.bin` -- and fifteen committed
        # render references of the outdoors -- were built from them. The graph now names all four
        # as stages, and these two claims are what stops one being quietly dropped again.
        run: |
          python3 tools/ci/build_content.py --selftest
          python3 tools/ci/build_content.py --check-docs

      - name: Snow must settle on decks and on nothing else
        working-directory: cna-house
        # `HOUSE-00214`. The slope test is measured from +Y rather than |Y|, so a deck's underside
        # (180 degrees) is excluded by the same comparison as a wall (90) -- a snow shell hanging
        # under the balcony is the one artefact this technique exists to make impossible. The
        # fixture puts identical tables indoors and out, and the shell carries FACE normals, which
        # the fixture model's authored +X normals would fail loudly if it did not.
        run: python3 tools/world/build_snowshell.py --selftest

      - name: The stride measurement must survive both animation conventions
        working-directory: cna-house
        # `HOUSE-00194`. The fixture is an analytically exact walk -- 1.4 m of stride over 1.0 s --
        # authored in BOTH conventions (root-translating mocap and in-place retarget), plus double
        # support, a dragging foot, an inch-scaled skeleton, two cycles in one clip, a turn in
        # place and four malformed sources. Pure stdlib: no numpy, no Pillow.
        run: python3 tools/assets/measure_stride.py --selftest

      - name: The .chanim writer must write what the reader accepts
        working-directory: cna-house
        # `HOUSE-00223`. The Python selftest checks the format's own rules; the C++ side of the
        # round trip is `ChanimRoundTripTests`, which reads a fixture this tool generates at build
        # time. Neither can make the claim alone: `ChanimReaderTests` builds its bytes by hand, so
        # a writer emitting transposed matrices or w-first quaternions passes every other test here.
        run: python3 tools/assets/anim_extract.py --selftest

      - name: The skin splitter must produce parts that skin identically
        working-directory: cna-house
        # `HOUSE-00224`. "Equivalent" is proved arithmetically, not by "the file loads": every
        # vertex's skinned world position is computed from the source and from the part under the
        # SHARED skeleton's pose, at rest and in motion, and the two must agree to 10 microns.
        run: python3 tools/assets/skin_split.py --selftest

      - name: A .chanim must bind to the model the game will load
        working-directory: cna-house
        # `HOUSE-00225`. The comparison is against the COMPILED `.cnb`, not the source `.glb`: what
        # ships is the `.cnb` and what `ClipLibrary::BindTo` resolves against is the bone table
        # inside it. The selftest builds the pair by hand -- the only way a fixture with a
        # DUPLICATE bone name can exist, since no importer produces one -- and, where cna-content
        # is available, also compiles a real model and binds the sidecar to that.
        run: python3 tools/ci/check_anim_assets.py --selftest

      - name: The smoke-scene assets must be what they claim to be
        working-directory: cna-house
        # `HOUSE-00201`. The PNG, WAV and GLB are written byte for byte by the script and are
        # asserted reproducible; the `.ogv` is not, because Theora's bitstream depends on the
        # encoder build, and the selftest says so instead of pretending. It also re-probes the clip
        # to check that all twenty authored frames survived the encode -- `libtheora` here drops a
        # frame identical to the one before it, which silently cost sixteen of them once.
        run: |
          python3 -m pip install --break-system-packages --user pillow
          python3 tools/assets/make_smoke_assets.py --selftest

      - name: The atlas packer must move the UVs it claims to move
        working-directory: cna-house
        # `HOUSE-00192`. The selftest authors its own prop set -- including a 30x18 source, a
        # TEXCOORD_0 shared by two materials, and a normalized-ushort TEXCOORD_0 -- packs it twice
        # and requires byte-identical output. It also requires the two REFUSALS to fire: UVs that
        # tile, and a material whose maps differ in size. Nothing is committed.
        #
        # Pillow decodes the source textures; numpy drives the blit and the PNG row filters. The
        # atlas ENCODER is this project's own precisely so the output bytes do not depend on which
        # Pillow a runner happens to have.
        run: |
          python3 -m pip install --break-system-packages --user numpy pillow
          python3 tools/assets/atlas_pack.py --selftest

      - name: The XNA-only gate must detect what it claims to
        working-directory: cna-house
        # A gate that has never been shown to fire is a gate nobody should trust. `--selftest`
        # plants a violation of each of the fourteen rejected classes and requires each to be found.
        run: tools/ci/check_xna_only.py --selftest

      - name: The fonts gate, and the audio converter's own claims
        working-directory: cna-house
        # `HOUSE-00193`: the audio selftest proves determinism AND proves that the naive ffmpeg
        # command embeds a toolchain fingerprint, so the flags that remove it cannot rot into
        # decoration.
        run: |
          sudo apt-get install -y ffmpeg
          python3 tools/ci/check_fonts.py
          python3 tools/assets/convert_audio.py --selftest

      - name: The LOD generator must hit its ratios and keep its silhouettes
        working-directory: cna-house
        # `HOUSE-00189`. Blender's glTF I/O needs numpy and Debian's Blender embeds the SYSTEM
        # python, so numpy is installed for that interpreter rather than assumed -- see
        # `tools/blender/blender_env.py`. The selftest authors its own fixture; nothing is committed.
        run: |
          sudo apt-get install -y blender
          /usr/bin/python3 -m pip install --break-system-packages --user numpy || true
          CNAHOUSE_BLENDER_PYTHONPATH="$HOME/.local/lib/python3/dist-packages" \
            python3 tools/blender/lod_gen.py --selftest
          CNAHOUSE_BLENDER_PYTHONPATH="$HOME/.local/lib/python3/dist-packages" \
            python3 tools/blender/collision_proxy.py --selftest

      - name: The lightmap unwrap must hit its density and keep its gutter
        working-directory: cna-house
        # `HOUSE-00205`. The fixture is a room shell -- floor, ceiling, four walls, a doorway and a
        # window -- because the failures this tool guards are architectural. Every claim is
        # measured from the packed UVs: the density per face, the empty texels between islands, and
        # a texel-centre rasterisation that catches two faces sharing one light sample.
        run: |
          CNAHOUSE_BLENDER_PYTHONPATH="$HOME/.local/lib/python3/dist-packages" \
            python3 tools/blender/lightmap_unwrap.py --selftest

      - name: A lightmap must be irradiance, not a picture of a lit room
        working-directory: cna-house
        # `HOUSE-00206`. Four settings decide whether this produces a lightmap or a photograph of
        # one, and each has its own claim: `use_pass_color=False` (the fixture's RED wall bakes to
        # a grey value and comes out red the moment it is on), `view_transform=Standard` (Blender
        # 4.x defaults to AgX and would tone-map the lighting), the SECOND UV set, and a recorded
        # normalisation scale because an 8-bit PNG cannot hold irradiance -- the fixture bakes to
        # 20. Cycles runs on CPU at 32px/16 samples here; the claims are about properties.
        run: |
          CNAHOUSE_BLENDER_PYTHONPATH="$HOME/.local/lib/python3/dist-packages" \
            python3 tools/blender/lightmap_bake.py --selftest

      - name: Sun shading must measure the eave and the neighbour, not each other
        working-directory: cna-house
        # `HOUSE-00207`. §22 names both effects, so the fixture is both: an eave over a south
        # window and a neighbour's gable to the south-west. The gable is proved responsible by
        # DELETING it and re-baking, because the eave shades the south-west too and an altitude
        # comparison cannot say which of the two did it. The first fixture put the neighbour due
        # west, where no ray from a south-facing window can ever reach it.
        run: |
          CNAHOUSE_BLENDER_PYTHONPATH="$HOME/.local/lib/python3/dist-packages" \
            python3 tools/blender/shading_factor.py --selftest

      - name: Sun patches must land in the room and sweep it, not jump
        working-directory: cna-house
        # `HOUSE-00208`. §29.1 interpolates two grid entries, so every node carries the SAME
        # lattice of points in the same row-major order -- a ray that hits nothing still emits a
        # point rather than shortening the node. The claims are that the patch lands behind the
        # window plane (the light travels opposite the sun; backwards it lands on the lawn), that
        # one patch spans the floor/wall junction, and that it moves monotonically as the sun
        # rises.
        run: |
          CNAHOUSE_BLENDER_PYTHONPATH="$HOME/.local/lib/python3/dist-packages" \
            python3 tools/blender/sun_patch.py --selftest

      - name: Mirror cube maps must be six faces that agree with each other
        working-directory: cna-house
        # `HOUSE-00209`. `HOUSE-00081` measured which face a direction samples against CNA itself;
        # what it did not measure is the orientation WITHIN a face, so the selftest checks the six
        # against each other instead: adjacent faces share an edge rendered from the same point,
        # and all twelve pairs must look in identical directions along it. That catches every
        # per-face error and leaves only a global handedness flip, which `docs/cubemap-format.md`
        # flags for a probe when the first mirror is placed.
        run: |
          CNAHOUSE_BLENDER_PYTHONPATH="$HOME/.local/lib/python3/dist-packages" \
            python3 tools/blender/cubemap_bake.py --selftest

      - name: The impostor atlas must be eight different views, none of them cropped
        working-directory: cna-house
        # `HOUSE-00204`. EEVEE renders headless here. The two claims that earn their place: no
        # slice's silhouette touches its cell border (Blender's ortho_scale applies to the LARGER
        # image dimension, so a 512x1024 frame set from the required width decapitates the
        # subject), and no two slices are pixel-identical (a view and its MIRROR have the same
        # silhouette area, so coverage cannot tell them apart).
        run: |
          CNAHOUSE_BLENDER_PYTHONPATH="$HOME/.local/lib/python3/dist-packages" \
            python3 tools/blender/impostor_render.py --selftest

  # --- HOUSE-00134 -------------------------------------------------------------------------------
  build-and-unit:
    name: build ${{ matrix.preset }} + unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-debug, linux-release]
    steps:
      - uses: actions/checkout@v4
        with: { path: cna-house }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/cnanext, path: cnanext }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/sharp-runtime, path: sharp-runtimenext }
      - uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.preset }}-
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache g++-14 \
            libgl1-mesa-dev libegl1-mesa-dev libasound2-dev libpulse-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            libfreetype-dev
      - name: Configure and build
        working-directory: cna-house
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }} -j"$(nproc)"
      - name: Content determinism
        if: matrix.preset == 'linux-release'
        working-directory: cna-house
        # `HOUSE-00199`. Once, on one preset: it builds every content root twice and the answer
        # cannot depend on the compiler flags of the program that does not participate in it.
        # `--selftest` first, because a determinism check that has never been shown to fail is a
        # check that reports green forever.
        run: |
          python3 tools/ci/content_verify.py --selftest
          python3 tools/ci/content_verify.py --hashes

      - name: The XNA-only rule, asked of the compiler
        if: matrix.preset == 'linux-debug'
        working-directory: cna-house
        # `HOUSE-00168`. It belongs HERE rather than in `lint`, because it needs
        # `build/compile_commands.json` and a compiler: it recompiles each translation unit with
        # `CNA_STRICT_XNA_API` and reports every call that actually RESOLVES to a CNAEXT member.
        # `check_xna_only.py` cannot see those -- `KeyboardState{}` names no forbidden identifier.
        run: python3 tools/ci/check_xna_strict.py --all

      - name: Unit tests
        working-directory: cna-house
        # Unit tests need no GPU and no display by construction: anything that does belongs in
        # `integration` or `render`.
        run: tools/ci/run_tests.sh --preset unit

  # --- HOUSE-00135 -------------------------------------------------------------------------------
  headless-integration:
    name: headless integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: cna-house }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/cnanext, path: cnanext }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/sharp-runtime, path: sharp-runtimenext }
      - uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-headless-${{ github.sha }}
          restore-keys: ccache-headless-
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache g++-14 libfreetype-dev \
            libasound2-dev libpulse-dev
      - name: Configure and build
        working-directory: cna-house
        run: |
          cmake --preset headless
          cmake --build --preset headless -j"$(nproc)"
      - name: Integration tests with no display server
        working-directory: cna-house
        # `DISPLAY` and `WAYLAND_DISPLAY` are unset deliberately. HOUSE-00105 measured 600 frames
        # under exactly these conditions, and a run that silently found an X server would prove
        # nothing about CI.
        run: env -u DISPLAY -u WAYLAND_DISPLAY tools/ci/run_tests.sh --preset integration

      - name: Twenty-minute stability run
        if: github.event_name == 'schedule'
        working-directory: cna-house
        # HOUSE-02598. The two production-collision walks repeat in long-lived processes so RSS
        # growth is meaningful; the report also proves the 60x weather cycle, settings writes and
        # absence of crashes/audio starvation. HOUSE-02784 reuses this runner for two hours once.
        run: |
          env -u DISPLAY -u WAYLAND_DISPLAY \
            tools/ci/run_stability.py --build-dir build-consumer \
              --report build-consumer/test-output/stability-report.json
      - name: Upload the stability report
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: stability-report
          path: |
            cna-house/build-consumer/test-output/stability-report.json
            cna-house/build-consumer/test-output/stability-*.log

  # --- HOUSE-00136 -------------------------------------------------------------------------------
  symbol-check:
    name: "no CNA::Graphics:: symbol is linked"
    runs-on: ubuntu-latest
    needs: build-and-unit
    steps:
      - uses: actions/checkout@v4
        with: { path: cna-house }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/cnanext, path: cnanext }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/sharp-runtime, path: sharp-runtimenext }
      - uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-release-${{ github.sha }}
          restore-keys: ccache-linux-release-
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache g++-14 binutils \
            libgl1-mesa-dev libegl1-mesa-dev libasound2-dev libpulse-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libfreetype-dev
      - name: Build
        working-directory: cna-house
        run: |
          cmake --preset linux-release
          cmake --build --preset linux-release --target cna-house -j"$(nproc)"
      - name: Assert the engine layer is absent from the binary
        working-directory: cna-house
        # SCOPE, measured by HOUSE-00063 and not to be widened without re-measuring: `CNA_CNAEXT=OFF`
        # removes `CNA::Graphics::` and `AvatarRenderer` -- 0 symbols against a control of 6 277 --
        # but it does NOT remove `SupportsCapability`, `GraphicsCapability`, `getSkinsEXTProperty`,
        # `setOwnedResources`, `ShaderEffect`, `PbrEffect`, `SkinnedPbrEffect` or `SkinnedModelEXT`,
        # which live in `Microsoft::Xna::Framework::Graphics` in the always-compiled core and are
        # linked regardless. For those, `check_xna_only.py` is the ONLY gate -- not a second line of
        # defence -- which is why it must never be relaxed.
        run: |
          set -euo pipefail
          binary=build/cna-house
          test -f "$binary"
          for symbol in 'CNA::Graphics::' 'AvatarRenderer'; do
            count=$(nm -C "$binary" | grep -c "$symbol" || true)
            echo "$symbol: $count"
            if [ "$count" -ne 0 ]; then
              echo "FAIL: $count occurrences of '$symbol' were linked into the binary." >&2
              exit 1
            fi
          done
          echo "OK: the CNAEXT engine layer is absent from the linked binary."

  # --- HOUSE-00137 (nightly) ---------------------------------------------------------------------
  sanitizers:
    name: ${{ matrix.preset }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-asan, linux-ubsan]
    steps:
      - uses: actions/checkout@v4
        with: { path: cna-house }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/cnanext, path: cnanext }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/sharp-runtime, path: sharp-runtimenext }
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache g++-14 xvfb \
            libgl1-mesa-dev libegl1-mesa-dev libasound2-dev libpulse-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libfreetype-dev
      - name: Configure and build
        working-directory: cna-house
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }} -j"$(nproc)"
      - name: Unit and integration under the sanitizer
        working-directory: cna-house
        # ADR-0003 and HOUSE-00106 both note that sanitizer binaries in these projects reach
        # 400-900 MB; only one variant is built per job for that reason.
        # HOUSE-02783: Mesa's drivers stay loaded, because memory a dlclose'd driver owned reads
        # as leaked with no frame to attribute it to; lsan.supp names the one third-party leak
        # left (Mesa GLX); and UBSan stops at its first report instead of printing and passing.
        env:
          LD_PRELOAD: libEGL_mesa.so.0 libGLX_mesa.so.0
          ASAN_OPTIONS: verify_asan_link_order=0
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/cna-house/tools/ci/lsan.supp
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          tools/ci/run_tests.sh \
            --test-dir build-${{ matrix.preset == 'linux-asan' && 'asan' || 'ubsan' }} \
            -L 'unit|integration'

  # --- HOUSE-00138 (nightly) ---------------------------------------------------------------------
  render-tests:
    name: render tests under Xvfb (OPENGLES3)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: cna-house }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/cnanext, path: cnanext }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/sharp-runtime, path: sharp-runtimenext }
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache g++-14 xvfb mesa-utils \
            libgl1-mesa-dev libegl1-mesa-dev libasound2-dev libpulse-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libfreetype-dev
      - name: Configure and build
        working-directory: cna-house
        run: |
          cmake --preset linux-release
          cmake --build --preset linux-release -j"$(nproc)"
      - name: Render tests
        working-directory: cna-house
        # A software rasteriser, so the numbers are reproducible and the job needs no GPU runner.
        # It is NOT the driver phase 1 measured against, so a render test asserts geometry and
        # coverage rather than exact shading -- see docs/cna-capability-report.md HOUSE-00115.
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a --server-args="-screen 0 1600x900x24" tools/ci/run_tests.sh --preset render
