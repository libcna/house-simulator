# cna-house CI.
#
# The jobs mirror `plan.md` HOUSE-00133..HOUSE-00138 one for one, and the split is by COST rather
# than by convenience: lint runs in seconds and gates every push, the sanitizer and render jobs are
# nightly because they are slow and because a red nightly is a message rather than a blocked merge.
#
# `cna-house` builds against `../cnanext` and `../sharp-runtimenext` as SIBLING checkouts
# (`cna-house.md` §8.1), so every build job checks all three out into that shape. There is no
# vendoring and no submodule to init; a runner that skipped a sibling would fail at configure with
# the message the root `CMakeLists.txt` prints, which is the intended behaviour.
name: ci

on:
  push:
  pull_request:
  schedule:
    # Nightly, after most working days have ended in Europe.
    - cron: "0 2 * * *"

env:
  # One ccache, always, and `CCACHE_BASEDIR` is what unifies hashes across build trees. The
  # openeggbert build rules exist because the alternative measured 330 s per build instead of 15 s.
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 2G

jobs:
  # --- HOUSE-00133 -------------------------------------------------------------------------------
  lint:
    name: lint (xna-only, layout, clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: cna-house }
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Run the gates
        working-directory: cna-house
        run: tools/ci/run_checks.sh
      - name: The committed effect baseline must match its source
        working-directory: cna-house
        # Runs on a runner with no Wine and no DirectX SDK, which is the whole point: a stale
        # `.xnb` is invisible on every machine that cannot compile effects, and this compares
        # hashes rather than compiling (`HOUSE-00185`).
        run: tools/effects/build_effects.sh --check

      - name: Asset provenance
        working-directory: cna-house
        # Separate from `run_checks.sh` so the CI log shows WHICH provenance rule failed. The
        # packaging run is the shipping gate (ADR-0012) and is allowed to fail here: it names the
        # assets that are development-only, which is information rather than a broken build.
        run: |
          python3 tools/ci/check_manifest.py
          python3 tools/assets/verify_licences.py --check
          python3 tools/assets/verify_licences.py --packaging \
            || echo "note: the packaging gate refuses the assets listed above; see licenses/THIRD-PARTY-ASSETS.md"

      - name: The pack partition and its budget report
        working-directory: cna-house
        # `HOUSE-00202`/`HOUSE-00203`. `--selftest` proves the report reports what it claims -- most
        # importantly that an unmeasurable value comes back UNKNOWN rather than 0, because a report
        # that silently zeroes an unbuilt asset says every budget is comfortably met.
        run: |
          python3 tools/assets/manifest.py packs
          python3 tools/ci/budget_report.py --selftest

      - name: The audio-derivative tools must measure what they claim
        working-directory: cna-house
        # `HOUSE-00220`/`HOUSE-00221`. Both make claims a listener cannot check in a build log --
        # "a 4th-order low-pass at 900 Hz", "the tail is 0.15 s", "it does not clip" -- so both
        # selftests MEASURE them: tone-by-tone response for the filter, and the impulse response
        # itself for the reverb tails. `audio_probe.py` decodes the WAV rather than asking ffmpeg,
        # so the measurement is of the bytes and not of the intention.
        run: |
          sudo apt-get install -y ffmpeg
          python3 tools/assets/dull_variants.py --selftest
          python3 tools/assets/reverb_variants.py --selftest

      - name: The NOX selection rules must select what they claim
        working-directory: cna-house
        # `HOUSE-00277`. The pool itself lives in scratch space and is not in CI, so what runs here
        # is the RULES against a fixture the selftest builds: one file for each exclusion, a
        # clipped file, a silent file, a group over its cap, and one no rule claims. The claim that
        # matters most is the partition -- every file selected, excluded, rejected or listed, none
        # of them twice -- because a selection that lost a file in the middle looks exactly like a
        # selection that did not want it.
        run: python3 tools/assets/nox_select.py --selftest

      - name: The video transcode must put every frame in the right cell
        working-directory: cna-house
        # `HOUSE-00219`. The fixture's every frame carries a black bar whose LENGTH is its own
        # index, so a decoded atlas cell says exactly which source frame it holds -- which is the
        # only way to catch a transposed grid, an off-by-one, or a frame dropped at the boundary
        # between the first atlas and the second. Six seconds at 12 fps is 72 frames, so the
        # second atlas exists and its first cell can be shown to hold frame 64.
        run: |
          python3 -m pip install --break-system-packages --user numpy pillow
          python3 tools/assets/video_transcode.py --selftest

      - name: The glTF gate must reject what it claims to
        working-directory: cna-house
        # `--selftest` plants three broken files -- a truncated header, wrong magic, and a
        # structurally valid file that breaks the one-skin project rule -- and requires each to be
        # rejected with a message that names the reason.
        run: python3 tools/assets/gltf_validate.py --selftest

      - name: The scale and origin gates must reject what they claim to
        working-directory: cna-house
        run: |
          python3 tools/assets/scale_check.py --selftest
          python3 tools/assets/origin_check.py --selftest
          python3 tools/assets/pbr_to_stock.py --selftest

      - name: The stride measurement must survive both animation conventions
        working-directory: cna-house
        # `HOUSE-00194`. The fixture is an analytically exact walk -- 1.4 m of stride over 1.0 s --
        # authored in BOTH conventions (root-translating mocap and in-place retarget), plus double
        # support, a dragging foot, an inch-scaled skeleton, two cycles in one clip, a turn in
        # place and four malformed sources. Pure stdlib: no numpy, no Pillow.
        run: python3 tools/assets/measure_stride.py --selftest

      - name: The .chanim writer must write what the reader accepts
        working-directory: cna-house
        # `HOUSE-00223`. The Python selftest checks the format's own rules; the C++ side of the
        # round trip is `ChanimRoundTripTests`, which reads a fixture this tool generates at build
        # time. Neither can make the claim alone: `ChanimReaderTests` builds its bytes by hand, so
        # a writer emitting transposed matrices or w-first quaternions passes every other test here.
        run: python3 tools/assets/anim_extract.py --selftest

      - name: The skin splitter must produce parts that skin identically
        working-directory: cna-house
        # `HOUSE-00224`. "Equivalent" is proved arithmetically, not by "the file loads": every
        # vertex's skinned world position is computed from the source and from the part under the
        # SHARED skeleton's pose, at rest and in motion, and the two must agree to 10 microns.
        run: python3 tools/assets/skin_split.py --selftest

      - name: A .chanim must bind to the model the game will load
        working-directory: cna-house
        # `HOUSE-00225`. The comparison is against the COMPILED `.cnb`, not the source `.glb`: what
        # ships is the `.cnb` and what `ClipLibrary::BindTo` resolves against is the bone table
        # inside it. The selftest builds the pair by hand -- the only way a fixture with a
        # DUPLICATE bone name can exist, since no importer produces one -- and, where cna-content
        # is available, also compiles a real model and binds the sidecar to that.
        run: python3 tools/ci/check_anim_assets.py --selftest

      - name: The smoke-scene assets must be what they claim to be
        working-directory: cna-house
        # `HOUSE-00201`. The PNG, WAV and GLB are written byte for byte by the script and are
        # asserted reproducible; the `.ogv` is not, because Theora's bitstream depends on the
        # encoder build, and the selftest says so instead of pretending. It also re-probes the clip
        # to check that all twenty authored frames survived the encode -- `libtheora` here drops a
        # frame identical to the one before it, which silently cost sixteen of them once.
        run: |
          python3 -m pip install --break-system-packages --user pillow
          python3 tools/assets/make_smoke_assets.py --selftest

      - name: The atlas packer must move the UVs it claims to move
        working-directory: cna-house
        # `HOUSE-00192`. The selftest authors its own prop set -- including a 30x18 source, a
        # TEXCOORD_0 shared by two materials, and a normalized-ushort TEXCOORD_0 -- packs it twice
        # and requires byte-identical output. It also requires the two REFUSALS to fire: UVs that
        # tile, and a material whose maps differ in size. Nothing is committed.
        #
        # Pillow decodes the source textures; numpy drives the blit and the PNG row filters. The
        # atlas ENCODER is this project's own precisely so the output bytes do not depend on which
        # Pillow a runner happens to have.
        run: |
          python3 -m pip install --break-system-packages --user numpy pillow
          python3 tools/assets/atlas_pack.py --selftest

      - name: The XNA-only gate must detect what it claims to
        working-directory: cna-house
        # A gate that has never been shown to fire is a gate nobody should trust. `--selftest`
        # plants a violation of each of the fourteen rejected classes and requires each to be found.
        run: tools/ci/check_xna_only.py --selftest

      - name: The fonts gate, and the audio converter's own claims
        working-directory: cna-house
        # `HOUSE-00193`: the audio selftest proves determinism AND proves that the naive ffmpeg
        # command embeds a toolchain fingerprint, so the flags that remove it cannot rot into
        # decoration.
        run: |
          sudo apt-get install -y ffmpeg
          python3 tools/ci/check_fonts.py
          python3 tools/assets/convert_audio.py --selftest

      - name: The LOD generator must hit its ratios and keep its silhouettes
        working-directory: cna-house
        # `HOUSE-00189`. Blender's glTF I/O needs numpy and Debian's Blender embeds the SYSTEM
        # python, so numpy is installed for that interpreter rather than assumed -- see
        # `tools/blender/blender_env.py`. The selftest authors its own fixture; nothing is committed.
        run: |
          sudo apt-get install -y blender
          /usr/bin/python3 -m pip install --break-system-packages --user numpy || true
          CNAHOUSE_BLENDER_PYTHONPATH="$HOME/.local/lib/python3/dist-packages" \
            python3 tools/blender/lod_gen.py --selftest
          CNAHOUSE_BLENDER_PYTHONPATH="$HOME/.local/lib/python3/dist-packages" \
            python3 tools/blender/collision_proxy.py --selftest

      - name: The lightmap unwrap must hit its density and keep its gutter
        working-directory: cna-house
        # `HOUSE-00205`. The fixture is a room shell -- floor, ceiling, four walls, a doorway and a
        # window -- because the failures this tool guards are architectural. Every claim is
        # measured from the packed UVs: the density per face, the empty texels between islands, and
        # a texel-centre rasterisation that catches two faces sharing one light sample.
        run: |
          CNAHOUSE_BLENDER_PYTHONPATH="$HOME/.local/lib/python3/dist-packages" \
            python3 tools/blender/lightmap_unwrap.py --selftest

  # --- HOUSE-00134 -------------------------------------------------------------------------------
  build-and-unit:
    name: build ${{ matrix.preset }} + unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-debug, linux-release]
    steps:
      - uses: actions/checkout@v4
        with: { path: cna-house }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/cnanext, path: cnanext }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/sharp-runtime, path: sharp-runtimenext }
      - uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.preset }}-
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache g++-14 \
            libgl1-mesa-dev libegl1-mesa-dev libasound2-dev libpulse-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            libfreetype-dev
      - name: Configure and build
        working-directory: cna-house
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }} -j"$(nproc)"
      - name: Content determinism
        if: matrix.preset == 'linux-release'
        working-directory: cna-house
        # `HOUSE-00199`. Once, on one preset: it builds every content root twice and the answer
        # cannot depend on the compiler flags of the program that does not participate in it.
        # `--selftest` first, because a determinism check that has never been shown to fail is a
        # check that reports green forever.
        run: |
          python3 tools/ci/content_verify.py --selftest
          python3 tools/ci/content_verify.py --hashes

      - name: The XNA-only rule, asked of the compiler
        if: matrix.preset == 'linux-debug'
        working-directory: cna-house
        # `HOUSE-00168`. It belongs HERE rather than in `lint`, because it needs
        # `build/compile_commands.json` and a compiler: it recompiles each translation unit with
        # `CNA_STRICT_XNA_API` and reports every call that actually RESOLVES to a CNAEXT member.
        # `check_xna_only.py` cannot see those -- `KeyboardState{}` names no forbidden identifier.
        run: python3 tools/ci/check_xna_strict.py --all

      - name: Unit tests
        working-directory: cna-house
        # Unit tests need no GPU and no display by construction: anything that does belongs in
        # `integration` or `render`.
        run: ctest --preset unit

  # --- HOUSE-00135 -------------------------------------------------------------------------------
  headless-integration:
    name: headless integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: cna-house }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/cnanext, path: cnanext }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/sharp-runtime, path: sharp-runtimenext }
      - uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-headless-${{ github.sha }}
          restore-keys: ccache-headless-
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache g++-14 libfreetype-dev \
            libasound2-dev libpulse-dev
      - name: Configure and build
        working-directory: cna-house
        run: |
          cmake --preset headless
          cmake --build --preset headless -j"$(nproc)"
      - name: Integration tests with no display server
        working-directory: cna-house
        # `DISPLAY` and `WAYLAND_DISPLAY` are unset deliberately. HOUSE-00105 measured 600 frames
        # under exactly these conditions, and a run that silently found an X server would prove
        # nothing about CI.
        run: env -u DISPLAY -u WAYLAND_DISPLAY ctest --preset integration

  # --- HOUSE-00136 -------------------------------------------------------------------------------
  symbol-check:
    name: "no CNA::Graphics:: symbol is linked"
    runs-on: ubuntu-latest
    needs: build-and-unit
    steps:
      - uses: actions/checkout@v4
        with: { path: cna-house }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/cnanext, path: cnanext }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/sharp-runtime, path: sharp-runtimenext }
      - uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-release-${{ github.sha }}
          restore-keys: ccache-linux-release-
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache g++-14 binutils \
            libgl1-mesa-dev libegl1-mesa-dev libasound2-dev libpulse-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libfreetype-dev
      - name: Build
        working-directory: cna-house
        run: |
          cmake --preset linux-release
          cmake --build --preset linux-release --target cna-house -j"$(nproc)"
      - name: Assert the engine layer is absent from the binary
        working-directory: cna-house
        # SCOPE, measured by HOUSE-00063 and not to be widened without re-measuring: `CNA_CNAEXT=OFF`
        # removes `CNA::Graphics::` and `AvatarRenderer` -- 0 symbols against a control of 6 277 --
        # but it does NOT remove `SupportsCapability`, `GraphicsCapability`, `getSkinsEXTProperty`,
        # `setOwnedResources`, `ShaderEffect`, `PbrEffect`, `SkinnedPbrEffect` or `SkinnedModelEXT`,
        # which live in `Microsoft::Xna::Framework::Graphics` in the always-compiled core and are
        # linked regardless. For those, `check_xna_only.py` is the ONLY gate -- not a second line of
        # defence -- which is why it must never be relaxed.
        run: |
          set -euo pipefail
          binary=build/cna-house
          test -f "$binary"
          for symbol in 'CNA::Graphics::' 'AvatarRenderer'; do
            count=$(nm -C "$binary" | grep -c "$symbol" || true)
            echo "$symbol: $count"
            if [ "$count" -ne 0 ]; then
              echo "FAIL: $count occurrences of '$symbol' were linked into the binary." >&2
              exit 1
            fi
          done
          echo "OK: the CNAEXT engine layer is absent from the linked binary."

  # --- HOUSE-00137 (nightly) ---------------------------------------------------------------------
  sanitizers:
    name: ${{ matrix.preset }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-asan, linux-ubsan]
    steps:
      - uses: actions/checkout@v4
        with: { path: cna-house }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/cnanext, path: cnanext }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/sharp-runtime, path: sharp-runtimenext }
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache g++-14 xvfb \
            libgl1-mesa-dev libegl1-mesa-dev libasound2-dev libpulse-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libfreetype-dev
      - name: Configure and build
        working-directory: cna-house
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }} -j"$(nproc)"
      - name: Unit and integration under the sanitizer
        working-directory: cna-house
        # ADR-0003 and HOUSE-00106 both note that sanitizer binaries in these projects reach
        # 400-900 MB; only one variant is built per job for that reason.
        run: |
          ctest --test-dir build-${{ matrix.preset == 'linux-asan' && 'asan' || 'ubsan' }} \
                -L 'unit|integration' --output-on-failure

  # --- HOUSE-00138 (nightly) ---------------------------------------------------------------------
  render-tests:
    name: render tests under Xvfb (OPENGLES3)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: cna-house }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/cnanext, path: cnanext }
      - uses: actions/checkout@v4
        with: { repository: openeggbert/sharp-runtime, path: sharp-runtimenext }
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache g++-14 xvfb mesa-utils \
            libgl1-mesa-dev libegl1-mesa-dev libasound2-dev libpulse-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libfreetype-dev
      - name: Configure and build
        working-directory: cna-house
        run: |
          cmake --preset linux-release
          cmake --build --preset linux-release -j"$(nproc)"
      - name: Render tests
        working-directory: cna-house
        # A software rasteriser, so the numbers are reproducible and the job needs no GPU runner.
        # It is NOT the driver phase 1 measured against, so a render test asserts geometry and
        # coverage rather than exact shading -- see docs/cna-capability-report.md HOUSE-00115.
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a --server-args="-screen 0 1600x900x24" ctest --preset render
